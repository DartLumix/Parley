name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.6"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  app:
    name: flutter analyze + test + release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang g++ cmake ninja-build meson nasm pkg-config libclang-dev \
            libgtk-3-dev liblzma-dev libpipewire-0.3-dev libasound2-dev \
            libva-dev
      # Compiles the bridge with every shipping feature: this is the half
      # CI never built before, and the one a release actually ships.
      - name: bridge (all features)
        run: |
          cargo build --release -p parley_flutter \
            --features audio-device,aec,video,screen-capture,hw-encode
          cargo clippy -p parley_flutter --all-targets \
            --features audio-device,aec,video,screen-capture,hw-encode \
            -- -D warnings
      # The shipping features are the ones that must actually run, not
      # just compile: video decode/assembly and the bundled AEC.
      - name: feature tests
        run: |
          cargo test -p parley-core --features video
          cargo test -p parley-client --features audio-device,aec
          # The disconnect/presence regression only reproduces with the
          # video task running (it holds a session-lifetime sender).
          cargo test -p parley_flutter --features video
      - name: flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build linux --release --dart-define=PARLEY_VERSION=ci

  # The second desktop target. It builds the reduced feature set Windows
  # can actually link: `audio-device` (WASAPI) and `video` (receive and
  # display), without `aec` (the WebRTC APM's build script is Unix-only)
  # or `screen-capture` (portal + PipeWire). Voice works, echo is not
  # cancelled; shares can be watched, not started.
  windows:
    name: windows build (voice + video)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: bridge (voice + video)
        run: |
          cargo build --release -p parley_flutter --features audio-device,video
          cargo clippy -p parley_flutter --all-targets --features audio-device,video -- -D warnings
      # These are the suites that can run in this shape: video
      # assembly/decoding through openh264, and the AEC-less mic path
      # (aec_off.rs) — the two halves Windows actually ships.
      - name: feature tests
        run: |
          cargo test -p parley-core --features video
          cargo test -p parley-client --features audio-device
      - name: flutter checks
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release --dart-define=PARLEY_VERSION=ci
      # A bundle that built but cannot load the bridge is the failure this
      # job exists to catch: the DLL has to sit next to parley.exe.
      - name: bundle contains the bridge
        run: |
          $bundle = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/parley.exe")) { throw "no parley.exe" }
          if (-not (Test-Path "$bundle/parley_flutter.dll")) {
            throw "parley_flutter.dll is not next to parley.exe"
          }
          if (-not (Test-Path "$bundle/data/flutter_assets")) {
            throw "no flutter_assets in the bundle"
          }
          Write-Host "bundle ok: parley.exe + parley_flutter.dll + assets"

  docker:
    name: image boots + client handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The smoke client is deliberately control-only: no ALSA, no
      # PipeWire, no display — it proves protocol, auth and routing.
      - run: cargo build --release -p parley-client
      - run: tools/e2e-container.sh
