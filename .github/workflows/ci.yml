name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.6"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  app:
    name: flutter analyze + test + release build
    runs-on: ubuntu-latest
    env:
      # Bundled Opus needs CMake < 3.5 compatibility; see the windows job
      # below (and docs/development.md). No effect on CMake 3.x.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang g++ cmake ninja-build meson nasm pkg-config libclang-dev \
            libgtk-3-dev liblzma-dev libpipewire-0.3-dev libasound2-dev \
            libva-dev
      # Compiles the bridge with every shipping feature: this is the half
      # CI never built before, and the one a release actually ships.
      - name: bridge (all features)
        run: |
          cargo build --release -p parley_flutter \
            --features audio-device,aec,video,screen-capture,hw-encode
          cargo clippy -p parley_flutter --all-targets \
            --features audio-device,aec,video,screen-capture,hw-encode \
            -- -D warnings
      # The shipping features are the ones that must actually run, not
      # just compile: video decode/assembly and the bundled AEC.
      - name: feature tests
        run: |
          cargo test -p parley-core --features video
          cargo test -p parley-client --features audio-device,aec
          # The disconnect/presence regression only reproduces with the
          # video task running (it holds a session-lifetime sender).
          cargo test -p parley_flutter --features video
      - name: flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build linux --release --dart-define=PARLEY_VERSION=ci
      # A green Linux build is only useful if the bundle can be picked
      # up and run. This is the raw Flutter bundle (no install.sh, no
      # WebRTC/abseil copying) — release.yml makes the real tarball; this
      # one exists so a branch push leaves something downloadable.
      - name: archive bundle
        run: |
          mkdir -p dist
          tar czf dist/parley-linux-x86_64-ci.tar.gz \
            -C app/build/linux/x64/release/bundle .
          tar tzf dist/parley-linux-x86_64-ci.tar.gz | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/parley-linux-x86_64-ci.tar.gz
          retention-days: 7
          if-no-files-found: error

  # The second desktop target. Windows links `audio-device` (WASAPI),
  # `video` (receive and display) and `aec-rust`: echo cancellation from
  # the pure-Rust AEC3 port, because the C++ APM's build script is
  # Unix-only. aec.rs swaps the backend and keeps the same API, so the
  # call sites and the synthetic-echo test are identical on both. Still
  # no `screen-capture` (portal + PipeWire): shares can be watched, not
  # started.
  windows:
    name: windows build (voice + video)
    runs-on: windows-latest
    env:
      # audiopus_sys builds Opus 1.3, whose CMakeLists still asks for
      # CMake < 3.5 — which CMake 4 (the runner's) rejects outright:
      # "Compatibility with CMake < 3.5 has been removed". This is the
      # sanctioned way to keep such a project configuring, and there is
      # no newer audiopus to move to. Harmless on CMake 3.x.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: bridge (voice + video + aec)
        run: |
          cargo build --release -p parley_flutter --features audio-device,aec-rust,video
          cargo clippy -p parley_flutter --all-targets --features audio-device,aec-rust,video -- -D warnings
      # These are the suites that can run in this shape: video
      # assembly/decoding through openh264, the synthetic-echo test against
      # the Rust AEC (tests/aec.rs — the same >10 dB assertion the Unix
      # backend has to pass), and the pass-through stub that a build with
      # no AEC feature ships (aec_off.rs).
      - name: feature tests
        run: |
          cargo test -p parley-core --features video
          cargo test -p parley-client --features audio-device,aec-rust
          cargo test -p parley-client --features audio-device --test aec_off
      - name: flutter checks
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release --dart-define=PARLEY_VERSION=ci
      # A bundle that built but cannot load the bridge is the failure this
      # job exists to catch: the DLL has to sit next to parley.exe.
      - name: bundle contains the bridge
        run: |
          $bundle = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/parley.exe")) { throw "no parley.exe" }
          if (-not (Test-Path "$bundle/parley_flutter.dll")) {
            throw "parley_flutter.dll is not next to parley.exe"
          }
          if (-not (Test-Path "$bundle/data/flutter_assets")) {
            throw "no flutter_assets in the bundle"
          }
          Write-Host "bundle ok: parley.exe + parley_flutter.dll + assets"
      # Downloadable without cutting a tag: the zip is the same layout
      # release.yml ships, minus the version in the name. Short retention
      # because this is a smoke build, not a distribution channel.
      - name: archive bundle
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/parley-windows-x86_64-ci.zip"
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/parley-windows-x86_64-ci.zip
          retention-days: 7
          if-no-files-found: error

  docker:
    name: image boots + client handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The smoke client is deliberately control-only: no ALSA, no
      # PipeWire, no display — it proves protocol, auth and routing.
      - run: cargo build --release -p parley-client
      - run: tools/e2e-container.sh
