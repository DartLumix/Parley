name: release

# Only a tag builds a release. `v0.2.0` is stable; `v0.2.0-rc1` is a
# prerelease and never gets the `latest` image tag. Manual dispatch
# re-runs an existing tag (after a failed job or a yanked asset).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.6"

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            PRE="$INPUT_PRE"
          else
            TAG="$REF_NAME"
            case "$TAG" in
              *-*) PRE="true" ;;
              *) PRE="false" ;;
            esac
          fi
          case "$TAG" in
            v*) ;;
            *) echo "release tags must start with v (got '$TAG')" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  verify:
    name: tests
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  server:
    name: server image
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: build
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: docker build -t "parley:${VERSION}" .
      - name: extract binary + image
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          cid=$(docker create "parley:${VERSION}")
          docker cp "$cid:/parley-server" "dist/parley-server-${VERSION}-x86_64-linux-musl"
          docker rm "$cid"
          docker save "parley:${VERSION}" | gzip -9 > "dist/parley-image-${VERSION}.tar.gz"
          ls -lh dist
      # The image tarball above is the authoritative artifact: it works
      # without registry credentials. GHCR is the convenience path.
      - name: push to GHCR
        continue-on-error: true
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRE: ${{ needs.meta.outputs.prerelease }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/parley"
          docker tag "parley:${VERSION}" "$IMAGE:${VERSION}"
          if [ "$PRE" = "false" ]; then docker tag "parley:${VERSION}" "$IMAGE:latest"; fi
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${VERSION}"
          if [ "$PRE" = "false" ]; then docker push "$IMAGE:latest"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: server-assets
          path: dist/*
          if-no-files-found: error

  client:
    name: Linux client
    needs: [meta, server]
    # 24.04, not 22.04: pipewire-rs 0.10 uses `spa_video_info_raw.flags`
    # unconditionally, and that field only exists in PipeWire >= 0.3.65
    # headers (22.04 ships 0.3.48, which fails with E0609). 24.04 also
    # sets the glibc baseline the tarball is built for.
    runs-on: ubuntu-24.04
    env:
      # audiopus_sys links the distro libopus.so by default on glibc
      # Linux, which would leave the tarball depending on the user's
      # libopus0. Skip pkg-config and build the bundled Opus, which
      # cmake compiles with -fPIC and links statically (24.04's
      # libopus.a is not PIC and cannot go into a .so).
      LIBOPUS_NO_PKG: "1"
      LIBOPUS_STATIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang g++ cmake ninja-build nasm pkg-config libclang-dev \
            python3-venv \
            libgtk-3-dev liblzma-dev libpipewire-0.3-dev libasound2-dev \
            libva-dev
      # The bundled AEC is configured by webrtc-audio-processing-sys,
      # which always passes `meson setup --reconfigure`. Not every
      # distro meson accepts that on a fresh build dir (0.61 refuses it:
      # "Directory does not contain a valid build tree"), so the job
      # pins a known-good meson in a venv instead of the distro one and
      # puts it first on PATH for the rest of the job.
      - name: meson for the bundled AEC
        run: |
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install --disable-pip-version-check \
            --no-cache-dir 'meson==1.12.1'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: clippy with shipping features
        run: |
          cargo clippy -p parley_flutter --all-targets \
            --features audio-device,aec,video,screen-capture,hw-encode \
            -- -D warnings
      - name: feature tests
        run: |
          cargo test -p parley-core --features video
          cargo test -p parley-client --features audio-device,aec
      # The deploy kit ships the server image inside it: one download,
      # one extract, one `docker load` — no hunting for a matching
      # image asset afterwards.
      - uses: actions/download-artifact@v4
        with:
          name: server-assets
          path: dist
      - name: package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          tools/package-client.sh "$VERSION" dist
          tools/package-cli.sh "$VERSION" dist
          tools/package-deploy.sh "$VERSION" dist \
            "dist/parley-image-${VERSION}.tar.gz"
          # The image now lives inside the deploy kit; keeping a second
          # copy would just be a duplicate download.
          rm "dist/parley-image-${VERSION}.tar.gz"
          ls -lh dist
      # A prebuilt binary that only runs on the builder is not shipped.
      # The bundle must resolve on a clean 24.04 — the oldest glibc and
      # PipeWire the build targets — with runtime packages only, and
      # must NOT carry the old system WebRTC dependency.
      - name: runtime dependency check (clean Ubuntu)
        run: |
          docker run --rm -v "$PWD/app/build/linux/x64/release/bundle:/bundle:ro" ubuntu:24.04 bash -c '
            apt-get update -qq
            apt-get install -y -qq libgtk-3-0t64 libpipewire-0.3-0t64 libasound2t64 \
                libstdc++6 libgl1 libegl1 >/dev/null
            missing=$(ldd /bundle/parley /bundle/lib/libparley_flutter.so \
                    /bundle/lib/libflutter_linux_gtk.so | grep "not found" || true)
            if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
            if ldd /bundle/lib/libparley_flutter.so | grep -Eq "webrtc-audio|absl"; then
              echo "system WebRTC/abseil linked — the AEC was not self-contained"
              ldd /bundle/lib/libparley_flutter.so | grep -E "webrtc-audio|absl"
              exit 1
            fi
            echo "bundle resolves on a clean Ubuntu 24.04, AEC self-contained"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: client-assets
          path: dist/*
          if-no-files-found: error

  # Second desktop client. The reduced feature set is not a shortcut:
  # the WebRTC APM (aec) and the portal/PipeWire capture path do not build
  # outside Unix, so Windows ships voice without echo cancellation and
  # can watch shares but not start one. docs/development.md has the why.
  windows:
    name: Windows client
    needs: [meta]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: bridge (voice + video)
        run: cargo build --release -p parley_flutter --features audio-device,video
      - name: flutter bundle
        working-directory: app
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --dart-define=PARLEY_VERSION=$env:VERSION
      - name: package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $bundle = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/parley_flutter.dll")) {
            throw "parley_flutter.dll is not next to parley.exe — the bundle would not start"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$bundle/*" `
            -DestinationPath "dist/parley-$env:VERSION-windows-x86_64.zip"
          Get-ChildItem dist | Format-Table Name, Length
      # The zip must open to a runnable app, not to a folder inside a
      # folder: extract it and check the layout the user gets.
      - name: archive layout
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "unzip"
          Expand-Archive -Path "dist/parley-$env:VERSION-windows-x86_64.zip" -DestinationPath $tmp
          foreach ($f in @("parley.exe", "parley_flutter.dll", "data/flutter_assets")) {
            if (-not (Test-Path (Join-Path $tmp $f))) { throw "missing $f in the zip" }
          }
          Write-Host "zip ok"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*
          if-no-files-found: error

  smoke:
    name: functional test
    needs: [meta, server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: control-only smoke client
        run: cargo build --release -p parley-client
      - name: boot the released image and authenticate
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # The image travels inside the deploy kit, so this also proves
          # the kit is complete and its image loads.
          tar xzf "dist/parley-deploy-${VERSION}.tar.gz" -C "$RUNNER_TEMP"
          docker load -i \
            "$RUNNER_TEMP/parley-deploy-${VERSION}/parley-image-${VERSION}.tar.gz"
          BUILD=0 IMAGE="parley:${VERSION}" tools/e2e-container.sh
      - name: assets are readable archives
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          for f in dist/parley-*.tar.gz; do tar tzf "$f" >/dev/null; done
          test -s "dist/parley-${VERSION}-linux-x86_64.tar.gz"
          echo "ok"

  publish:
    name: GitHub release
    needs: [meta, verify, server, client, windows, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums and notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # The image ships INSIDE the deploy kit. The server job uploads
          # a standalone copy so the smoke job can load it; it must not
          # become a second release asset.
          rm -f dist/parley-image-*.tar.gz
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          # CHANGELOG.md is wrapped at 80 columns; GitHub renders every
          # newline as a hard break, so refill each paragraph and bullet
          # into one line before publishing.
          python3 - CHANGELOG.md "$VERSION" > notes.md <<'PY'
          import re, sys

          path, version = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          def find_section(ver):
              return re.search(
                  rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                  text, re.M | re.S,
              )

          # Prerelease tags (0.2.1-rc1) reuse the stable version's notes
          # unless they keep a section of their own.
          section = find_section(version) or find_section(version.split("-")[0])
          if section is None:
              sys.exit(f"CHANGELOG.md has no section for {version}")

          blocks = []
          for block in re.split(r"\n\s*\n", section.group(1).strip()):
              lines = [line.strip() for line in block.splitlines() if line.strip()]
              if lines and (lines[0].startswith("#") or lines[0].startswith("- ")):
                  items = []
                  for line in lines:
                      if line.startswith(("#", "- ")):
                          items.append(line)
                      else:
                          items[-1] += " " + line
                  blocks.append("\n".join(items))
              elif lines:
                  blocks.append(" ".join(lines))
          # One heading level up: the release page already shows the
          # version as its title, so "### Added" becomes "## Added".
          blocks = [block[1:] if block.startswith("### ") else block for block in blocks]
          print("\n\n".join(blocks))
          PY
          {
            echo
            echo "## Assets"
            echo
            echo "- \`parley-${VERSION}-linux-x86_64.tar.gz\` — desktop client (extract, run \`./install.sh\`)"
            echo "- \`parley-${VERSION}-windows-x86_64.zip\` — Windows desktop client (extract, run \`parley.exe\`; voice without echo cancellation, no screen sharing)"
            echo "- \`parley-cli-${VERSION}-linux-x86_64.tar.gz\` — terminal client and \`--check\` smoke tool"
            echo "- \`parley-server-${VERSION}-x86_64-linux-musl\` — static server, if you do not want Docker"
            echo "- \`parley-deploy-${VERSION}.tar.gz\` — deploy kit: compose file, env template, VPS runbook, AND the server image"
            echo "- \`SHA256SUMS\`"
            echo
            echo "Deploy: \`tar xf parley-deploy-${VERSION}.tar.gz\`, \`docker load -i parley-deploy-${VERSION}/parley-image-${VERSION}.tar.gz\`, \`docker compose up -d\`."
            echo "Client: \`tar xf parley-${VERSION}-linux-x86_64.tar.gz && cd parley-${VERSION}-linux-x86_64 && ./install.sh\`. Windows: unzip and run \`parley.exe\`."
          } >> notes.md
          cat notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRE: ${{ needs.meta.outputs.prerelease }}
        run: |
          ARGS=(--title "Parley $TAG" --notes-file notes.md)
          if [ "$PRE" = "true" ]; then ARGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" "${ARGS[@]}"
          else
            gh release create "$TAG" dist/* "${ARGS[@]}" --verify-tag
          fi
          gh release view "$TAG" --json url,assets --jq '{url, assets: [.assets[].name]}'
