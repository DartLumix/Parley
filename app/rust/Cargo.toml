[package]
name = "parley_flutter"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# Device I/O (cpal) + AEC (via parley-client's audio-device, which
# brings webrtc-audio-processing) — default OFF so workspace-wide CI
# clippy and the server's musl Docker build never touch alsa-sys (the
# §11 convention, extended to the bridge crate). The Flutter app builds
# with --features audio-device; without it, voice_start returns an
# error and everything else works.
audio-device = [
    "dep:cpal",
    "dep:webrtc-audio-processing",
    "parley-core/audio-device",
    "parley-client/audio-device",
]
# 7f: video receive (openh264 decode via parley-core/video) + the
# Flutter texture display bridge (irondash_texture). Default off: CI
# and the musl server build never touch openh264 or the texture glue.
# The app builds with --features audio-device,video.
video = ["dep:irondash_texture", "dep:irondash_engine_context", "parley-core/video"]
# 7g: in-app screen SHARE (portal capture + encode via parley-client's
# screen module). Builds ashpd/pipewire into the bridge .so.
screen-capture = ["parley-client/screen-capture", "video"]
# 7g: hardware (VAAPI) encode support — build the moq-vaapi backend in
# and let the app's HW-encode toggle do something. Without it the
# toggle is hidden (hw_encode_supported() = false) and encoding is
# always software. Opt-in like the CLI's --hw-encode: CI and the musl
# server build never touch libva.
hw-encode = ["parley-client/vaapi", "video"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
parley-core = { path = "../../crates/parley-core", default-features = false }
parley-proto = { path = "../../crates/parley-proto" }
parley-client = { path = "../../crates/parley-client", default-features = false }
quinn = { workspace = true }
prost = { workspace = true }
cpal = { workspace = true, optional = true }
# Direct (optional) so the render-callback state can NAME the
# Processor type — parley_client::aec::new_processor returns
# Arc<Processor>, and storing it needs the crate in this manifest.
# Same workspace-pinned 2.1 as parley-client's own dep: unified.
webrtc-audio-processing = { workspace = true, optional = true }
# 7f texture bridge (see the video feature above).
irondash_texture = { workspace = true, optional = true }
irondash_engine_context = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
