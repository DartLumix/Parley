[package]
name = "parley_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
parley-core = { path = "../../crates/parley-core", default-features = false, features = ["audio-device"] }
parley-proto = { path = "../../crates/parley-proto" }
parley-client = { path = "../../crates/parley-client", default-features = false }
quinn = { workspace = true }
prost = { workspace = true }
cpal = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
