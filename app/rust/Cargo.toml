[package]
name = "parley_flutter"
version = "0.3.5"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# Device I/O (cpal) — default OFF so workspace-wide CI clippy and the
# server's musl Docker build never touch alsa-sys (the §11 convention,
# extended to the bridge crate). The Flutter app builds with --features
# audio-device; without it, voice_start returns an error and everything
# else works. Echo cancellation is a separate feature, one per backend:
# `aec` on Unix, `aec-rust` on Windows.
audio-device = [
    "dep:cpal",
    "parley-core/audio-device",
    "parley-client/audio-device",
]
# Echo cancellation, Unix: the WebRTC Audio Processing Module. Split out
# because its build needs meson and a C++ toolchain. Linux without it is a
# compile error below, so a release can never quietly ship without echo
# cancellation.
aec = ["audio-device", "parley-client/aec"]
# Echo cancellation, Windows: Sonora's pure-Rust port of the same AEC3
# pipeline, because the C++ APM's build script is Unix-only. Same API,
# same call sites (`parley-client::aec`) — only the filter differs, and
# aec.rs refuses a build that enables both.
aec-rust = ["audio-device", "parley-client/aec-rust"]
# 7f: video receive (openh264 decode via parley-core/video) + the
# Flutter texture display bridge (irondash_texture). Default off: CI
# and the musl server build never touch openh264 or the texture glue.
# The app builds with --features audio-device,video.
video = ["dep:irondash_texture", "dep:irondash_engine_context", "parley-core/video"]
# 7g: in-app screen SHARE (portal capture + encode via parley-client's
# screen module). Builds ashpd/pipewire into the bridge .so.
screen-capture = ["parley-client/screen-capture", "video"]
# 7g: hardware (VAAPI) encode support — build the moq-vaapi backend in
# and let the app's hardware-encoding setting (Settings → Video) do
# something. Without it the switch is hidden (hw_encode_supported() =
# false) and encoding is always software. Opt-in like the CLI's --hw-encode: CI and the musl
# server build never touch libva.
hw-encode = ["parley-client/vaapi", "video"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
parley-core = { path = "../../crates/parley-core", default-features = false }
parley-proto = { path = "../../crates/parley-proto" }
parley-client = { path = "../../crates/parley-client", default-features = false }
quinn = { workspace = true }
prost = { workspace = true }
cpal = { workspace = true, optional = true }
# 7f texture bridge (see the video feature above).
irondash_texture = { workspace = true, optional = true }
irondash_engine_context = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
# Remembered login (api/login.rs): the session token in a TOML file.
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# The disconnect regression test runs a real server in-process.
parley-server = { path = "../../crates/parley-server" }
