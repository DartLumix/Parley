name: parley
description: "Parley — self-hosted voice, chat and screen share (Linux desktop client)."
publish_to: 'none'
version: 0.4.3+15

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  # 7f: exports the engine handle the Rust texture bridge needs (its
  # native plugin registers the symbols irondash dlsym-resolves).
  irondash_engine_context: ^0.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
