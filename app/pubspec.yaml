name: parley
description: "Parley — self-hosted voice, chat and screen share (Linux desktop client)."
publish_to: 'none'
version: 0.4.4+16

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  # 7f: exports the engine handle the Rust texture bridge needs (its
  # native plugin registers the symbols irondash dlsym-resolves).
  irondash_engine_context: ^0.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Written by hand before a release: the app shows it on the first launch
    # of a version and behind Settings → What's new.
    - assets/patch_notes.md
