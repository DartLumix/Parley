syntax = "proto3";

package parley;

import "role.proto";

message AuthRequest {
  string username = 1;
  string password = 2;
  string session_token = 3;
}

message AuthOk {
  uint32 user_id = 1;
  // True only for the full ADMIN role. Kept for older clients, whose
  // admin gate predates the role tiers.
  bool is_admin = 2;
  string session_token = 3;
  // Additive: an older server leaves this USER, which is the safe
  // default (no management page). An older client ignores it.
  Role role = 4;
}

message AuthDenied {
  string reason = 1;
}
