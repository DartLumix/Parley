syntax = "proto3";

package parley;

import "role.proto";

// --- Heartbeats ---

message Heartbeat {
  uint64 client_time_ms = 1;
}

message HeartbeatAck {
  uint64 client_time_ms = 1;
  uint64 server_time_ms = 2;
}

// --- Presence ---

message PresenceRequest {}

message PresenceUser {
  uint32 user_id = 1;
  string username = 2;
}

message PresenceList {
  repeated PresenceUser users = 1;
}

// --- Channels & chat ---

// 6d: a channel IS speech or music — set at creation, not negotiated
// per join. Music channels run the 256 kbps stereo profile.
enum ChannelMode {
  SPEECH = 0;
  MUSIC = 1;
}

message Channel {
  uint64 id = 1;
  string name = 2;
  ChannelMode mode = 3;
  // Chat in this channel drops after 24 hours unless a message is pinned.
  // On by default; mods and admins can turn it off per channel.
  bool ephemeral = 4;
}

message ListChannels {}

message ChannelList {
  repeated Channel channels = 1;
}

message SendChat {
  uint64 channel_id = 1;
  string text = 2;
}

message ChatMessage {
  uint64 message_id = 1;
  uint64 channel_id = 2;
  uint32 user_id = 3;
  string username = 4;
  string text = 5;
  uint64 timestamp_ms = 6;
  // Pinned messages survive the 24-hour expiry. A pin flip is broadcast
  // as a ChatMessage with the same id and the new flag; clients update
  // the row in place.
  bool pinned = 7;
}

// Client -> server: pin or unpin one message (answer: a ChatMessage
// broadcast carrying the new flag).
message PinMessage {
  uint64 message_id = 1;
  bool pinned = 2;
}

message FetchHistory {
  uint64 channel_id = 1;
  uint32 limit = 2;
  uint64 before_message_id = 3;
}

message HistoryResult {
  repeated ChatMessage messages = 1;
}

// --- Voice channels ---

message JoinVoice {
  uint64 channel_id = 1;
}

message LeaveVoice {}

message VoiceState {
  uint32 user_id = 1;
  uint64 channel_id = 2;
  bool joined = 3;
  // Mic muted. The client announces it (SetMute) and the server keeps it
  // per user, so the roster can show a muted badge without listening to
  // their packets.
  bool muted = 4;
  // Away status ("coming back later..."), announced by SetStatus. Empty
  // means none. Server-held per user like `muted`, so the roster shows it
  // without extra requests.
  string status = 5;
}

// Client -> server: my microphone is (un)muted. Answered by a VoiceState
// broadcast carrying the same flag, to the whole session (the roster is
// not channel-scoped in the UI).
message SetMute {
  bool muted = 1;
}

// Client -> server: set my away status. Empty text clears it. Answered by
// a VoiceState broadcast carrying the text (whole session, like mute).
message SetStatus {
  string text = 1;
}

message VoiceStatesRequest {}

message VoiceStateList {
  repeated VoiceState states = 1;
}

// --- Loss feedback (4d) ---

message ReceiverReport {
  uint32 gap_rate_permille = 1;
  // Server-stamped authenticated reporter id (clients send 0) —
  // lets a sender ignore its own report echoed by the broadcast.
  uint32 reporter_id = 2;
}

// --- Screen share lifecycle (6a) ---

message StopShare {}

message ShareStopped {
  // Server-stamped authenticated sharer id — viewers match it against
  // the sender_id on video datagrams; the sharer ignores its own echo.
  uint32 user_id = 1;
}

// --- Video loss feedback (6e) ---

message VideoReport {
  uint32 gap_rate_permille = 1;
  // Server-stamped authenticated reporter id (clients send 0).
  uint32 reporter_id = 2;
  // Decoded pictures per second, as this viewer actually sustains them
  // (worst active sender). 0 = not reported (an older client). The
  // sender's pace governor steps resolution down to it rather than
  // lowering the frame rate until the picture is a slideshow; the
  // server may instead re-encode a lower tier for this viewer.
  // Additive: a server that predates it forwards 0, and a sender that
  // predates it ignores the field.
  uint32 viewer_fps = 3;
}

// --- Server management ---

message ManagedUser {
  uint32 user_id = 1;
  string username = 2;
  Role role = 3;
  bool online = 4;
  // 0 = not in a voice channel. The management page uses it to offer a
  // kick only to a manager when the target is actually in a channel.
  uint64 channel_id = 5;
}

message ManagedChannel {
  uint64 channel_id = 1;
  string name = 2;
  ChannelMode mode = 3;
  uint32 members = 4;
  bool ephemeral = 5;
}

message ManageState {
  repeated ManagedUser users = 1;
  repeated ManagedChannel channels = 2;
}

message ManageStateRequest {}

message AddUser {
  string username = 1;
  string password = 2;
  Role role = 3;
}

message UpdateUser {
  uint32 user_id = 1;
  // Empty means unchanged — the edit dialog sends the current value for
  // fields the operator did not touch.
  string username = 2;
  string password = 3;
  Role role = 4;
}

message RemoveUser {
  uint32 user_id = 1;
}

message CreateChannel {
  string name = 1;
  ChannelMode mode = 2;
  // Unset means the default: ephemeral on.
  optional bool ephemeral = 3;
}

message UpdateChannel {
  uint64 channel_id = 1;
  // Empty means unchanged.
  string name = 2;
  ChannelMode mode = 3;
  // Unset means unchanged, so an older manager cannot clear it by
  // omitting the field.
  optional bool ephemeral = 4;
}

message DeleteChannel {
  uint64 channel_id = 1;
}

message KickUser {
  uint32 user_id = 1;
  uint64 channel_id = 2;
}

message ManageRequest {
  oneof action {
    ManageStateRequest state = 1;
    AddUser add_user = 2;
    UpdateUser update_user = 3;
    RemoveUser remove_user = 4;
    CreateChannel create_channel = 5;
    UpdateChannel update_channel = 6;
    DeleteChannel delete_channel = 7;
    KickUser kick_user = 8;
  }
}

message ManageResult {
  bool ok = 1;
  string error = 2;
  ManageState state = 3;
}

// --- Envelopes ---

message ClientMessage {
  oneof body {
    Heartbeat heartbeat = 1;
    PresenceRequest presence_request = 2;
    ListChannels list_channels = 3;
    SendChat send_chat = 4;
    FetchHistory fetch_history = 5;
    JoinVoice join_voice = 6;
    LeaveVoice leave_voice = 7;
    VoiceStatesRequest voice_states_request = 8;
    ReceiverReport receiver_report = 9;
    StopShare stop_share = 10;
    VideoReport video_report = 11;
    SetMute set_mute = 12;
    ManageRequest manage = 13;
    SetStatus set_status = 14;
    PinMessage pin_message = 15;
  }
}

message ServerMessage {
  oneof body {
    HeartbeatAck heartbeat_ack = 1;
    PresenceList presence_list = 2;
    ChannelList channel_list = 3;
    ChatMessage chat_message = 4;
    HistoryResult history_result = 5;
    VoiceState voice_state = 6;
    VoiceStateList voice_state_list = 7;
    ReceiverReport receiver_report = 8;
    ShareStopped share_stopped = 9;
    VideoReport video_report = 10;
    ManageResult manage_result = 11;
  }
}
