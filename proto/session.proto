syntax = "proto3";

package parley;

// --- Heartbeats ---

message Heartbeat {
  uint64 client_time_ms = 1;
}

message HeartbeatAck {
  uint64 client_time_ms = 1;
  uint64 server_time_ms = 2;
}

// --- Presence ---

message PresenceRequest {}

message PresenceUser {
  uint32 user_id = 1;
  string username = 2;
}

message PresenceList {
  repeated PresenceUser users = 1;
}

// --- Channels & chat ---

// 6d: a channel IS speech or music — set at creation, not negotiated
// per join. Music channels run the 256 kbps stereo profile.
enum ChannelMode {
  SPEECH = 0;
  MUSIC = 1;
}

message Channel {
  uint64 id = 1;
  string name = 2;
  ChannelMode mode = 3;
}

message ListChannels {}

message ChannelList {
  repeated Channel channels = 1;
}

message SendChat {
  uint64 channel_id = 1;
  string text = 2;
}

message ChatMessage {
  uint64 message_id = 1;
  uint64 channel_id = 2;
  uint32 user_id = 3;
  string username = 4;
  string text = 5;
  uint64 timestamp_ms = 6;
}

message FetchHistory {
  uint64 channel_id = 1;
  uint32 limit = 2;
  uint64 before_message_id = 3;
}

message HistoryResult {
  repeated ChatMessage messages = 1;
}

// --- Voice channels ---

message JoinVoice {
  uint64 channel_id = 1;
}

message LeaveVoice {}

message VoiceState {
  uint32 user_id = 1;
  uint64 channel_id = 2;
  bool joined = 3;
  // Mic muted. The client announces it (SetMute) and the server keeps it
  // per user, so the roster can show a muted badge without listening to
  // their packets.
  bool muted = 4;
}

// Client -> server: my microphone is (un)muted. Answered by a VoiceState
// broadcast carrying the same flag, to the whole session (the roster is
// not channel-scoped in the UI).
message SetMute {
  bool muted = 1;
}

message VoiceStatesRequest {}

message VoiceStateList {
  repeated VoiceState states = 1;
}

// --- Loss feedback (4d) ---

message ReceiverReport {
  uint32 gap_rate_permille = 1;
  // Server-stamped authenticated reporter id (clients send 0) —
  // lets a sender ignore its own report echoed by the broadcast.
  uint32 reporter_id = 2;
}

// --- Screen share lifecycle (6a) ---

message StopShare {}

message ShareStopped {
  // Server-stamped authenticated sharer id — viewers match it against
  // the sender_id on video datagrams; the sharer ignores its own echo.
  uint32 user_id = 1;
}

// --- Video loss feedback (6e) ---

message VideoReport {
  uint32 gap_rate_permille = 1;
  // Server-stamped authenticated reporter id (clients send 0).
  uint32 reporter_id = 2;
  // Decoded pictures per second, as this viewer actually sustains them
  // (worst active sender). 0 = not reported (an older client). The
  // sender's pace governor steps resolution down to it rather than
  // lowering the frame rate until the picture is a slideshow; the
  // server may instead re-encode a lower tier for this viewer.
  // Additive: a server that predates it forwards 0, and a sender that
  // predates it ignores the field.
  uint32 viewer_fps = 3;
}

// --- Envelopes ---

message ClientMessage {
  oneof body {
    Heartbeat heartbeat = 1;
    PresenceRequest presence_request = 2;
    ListChannels list_channels = 3;
    SendChat send_chat = 4;
    FetchHistory fetch_history = 5;
    JoinVoice join_voice = 6;
    LeaveVoice leave_voice = 7;
    VoiceStatesRequest voice_states_request = 8;
    ReceiverReport receiver_report = 9;
    StopShare stop_share = 10;
    VideoReport video_report = 11;
    SetMute set_mute = 12;
  }
}

message ServerMessage {
  oneof body {
    HeartbeatAck heartbeat_ack = 1;
    PresenceList presence_list = 2;
    ChannelList channel_list = 3;
    ChatMessage chat_message = 4;
    HistoryResult history_result = 5;
    VoiceState voice_state = 6;
    VoiceStateList voice_state_list = 7;
    ReceiverReport receiver_report = 8;
    ShareStopped share_stopped = 9;
    VideoReport video_report = 10;
  }
}
