[package]
name = "parley-client"
version.workspace = true
edition.workspace = true

[features]
# Off by default so `cargo test --workspace` (CI, no ALSA) builds the
# control-only client. Local voice runs:
#   cargo run -p parley-client --features audio-device -- ...
audio-device = ["dep:cpal", "parley-core/audio-device", "dep:webrtc-audio-processing"]

[dependencies]
parley-core = { workspace = true }
parley-proto = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
prost = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
cpal = { workspace = true, optional = true }
webrtc-audio-processing = { workspace = true, optional = true }
