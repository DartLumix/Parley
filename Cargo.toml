[workspace]
resolver = "2"
members = [
    "crates/parley-proto",
    "crates/parley-core",
    "crates/parley-server",
    "crates/parley-client",
    "app/rust"
]
# The patched VA-API crate (see vendor/README.md) is a dependency, not a
# member: fmt/clippy/test --workspace must not sweep its upstream sources.
exclude = ["vendor/moq-vaapi"]


[workspace.package]
version = "0.4.3"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
parley-core = { path = "crates/parley-core" }
parley-proto = { path = "crates/parley-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
bytes = "1"
futures-util = "0.3"
audiopus = "0.3.0-rc.0"
cpal = "0.15"
# `bundled` compiles WebRTC APM from source and links it statically. The
# default links the SYSTEM library (libwebrtc-audio-processing-2.so), which
# is not installed on most distros — a prebuilt client would fail to start
# there. Build requirement: meson, ninja, a C++ toolchain and libclang
# (bindgen); runtime requirement: none.
webrtc-audio-processing = { version = "2.1", features = ["bundled"] }
# The Windows AEC: a pure-Rust port of the same AEC3 pipeline, for the
# platform where the C++ APM's meson build script does not exist. Needs
# rustc >= 1.91 (rust-version in its manifest).
sonora = "0.2"
openh264 = "0.9"
ashpd = "0.13"
pipewire = "0.10"
# 7f: Flutter external textures from Rust (app display bridge for video
# receive). irondash_texture 0.5.0 is the latest stable (the 0.6 line
# is pre-release dev); irondash_engine_context provides the engine
# handle the texture machinery needs (the Dart side needs the matching
# pub package irondash_engine_context — app/pubspec.yaml).
irondash_texture = "0.5"
irondash_engine_context = "0.5"

# PARLEY PATCH: the published moq-vaapi 0.1.0 hands its SPS/PPS to the driver
# as packed headers and trusts them to reach the coded buffer. On radeonsi/VCE
# they do not, so a hardware-encoded H.264 stream carried NO parameter sets at
# all and no receiver could decode it. The vendored copy writes them in-band in
# front of every IDR; see vendor/README.md. Only builds with the `vaapi`
# feature touch this at all.
[patch.crates-io]
moq-vaapi = { path = "vendor/moq-vaapi" }

[profile.release]
strip = true
lto = "thin"


# For profiling: release optimization + symbols. Used for perf work
# (6g CPU investigation; see docs/hd-encode-runs.md for the measurements).
[profile.release-with-debug]
inherits = "release"
strip = false
debug = "line-tables-only"
